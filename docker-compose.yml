version: '3.8'

services:

  postgres-db:
    image: postgres:15-alpine
    container_name: performance_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: colaborador_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - performance-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: performance_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres-db
    networks:
      - performance-network

networks:
  performance-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data: